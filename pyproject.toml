[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "company-footprint"
version = "0.1.0"
description = "Evidence-first company footprint scanner and agent skills"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["langchain", "langchain-openai"]
web = ["django>=5.2", "huey>=2.5", "psycopg[binary]>=3.2", "whitenoise>=6", "jinja2>=3.1", "langchain", "langchain-openai"]

[project.scripts]
companyscan = "companyscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
companyscan = ["views/templates/*.html", "views/static/*", "views/report/*", "skills/*/*.md", "skills/*/references/*.md"]
