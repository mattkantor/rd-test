[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "company-footprint"
version = "0.1.0"
description = "Evidence-first company footprint scanner and agent skills"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["langchain", "langchain-openai"]
dev = ["ruff"]
web = ["django>=5.2", "huey>=2.5", "psycopg[binary]>=3.2", "whitenoise>=6", "cryptography>=42", "jinja2>=3.1", "langchain", "langchain-openai"]

[project.scripts]
companyscan = "companyscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
companyscan = ["views/templates/*.html", "views/static/*", "views/report/*", "skills/*/*.md", "skills/*/references/*.md"]

[tool.ruff]
target-version = "py310"
line-length = 160

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
# House style: short lambdas and `l` loop names are idiomatic here; zips pair lists of equal length by construction.
ignore = ["E731", "E741", "B905"]
